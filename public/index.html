<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zip Test</title>
</head>
<body style="font-family:Arial;text-align:center;padding:40px">
  <h2>Welcome to Zip</h2>
  <input id="n" placeholder="5 word name" style="padding:12px;font-size:16px"><br><br>
  <button id="m" onclick="g='Male';this.style.background='lightgreen'" style="padding:12px 20px">Male</button>
  <button id="f" onclick="g='Female';this.style.background='lightgreen'" style="padding:12px 20px">Female</button><br><br>
  <button onclick="if(document.getElementById('n').value.length>=5 && g){alert('Success! App chal gaya: '+g)}else{alert('5 letter naam aur Male/Female chunein')}" style="padding:14px 28px;background:#008069;color:white;border:none;border-radius:20px;font-size:16px">Aage Badhein</button>
  <script>var g='';</script>
</body>
</html>
