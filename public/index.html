<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Welcome to Zip</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Arial, sans-serif; }
        html, body { width: 100%; height: 100dvh; background: #ffffff; margin: 0; padding: 0; overflow: hidden; }
        .app-container { width: 100%; height: 100dvh; background: #ffffff; display: flex; flex-direction: column; overflow: hidden; position: relative; }

        /* Headers */
        .header { background: linear-gradient(90deg, #008069, #006d59); color: white; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 5px rgba(0,0,0,0.15); z-index: 10; }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .back-btn { background: none; border: none; color: white; font-size: 22px; cursor: pointer; padding-right: 4px; }
        .avatar { width: 42px; height: 42px; background: #dfe5e7; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: #008069; font-weight: 700; font-size: 18px; position: relative; }
        .online-dot { width: 11px; height: 11px; background: #25d366; border: 2px solid white; border-radius: 50%; position: absolute; bottom: 0; right: 0; }
        .header-info h3 { font-size: 16px; font-weight: 700; }
        .header-info p { font-size: 11.5px; color: #d9fdd3; margin-top: 2px; }
        .invite-btn { background-color: #25d366; color: white; border: none; padding: 8px 13px; border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .icon-btn { background: rgba(255,255,255,0.18); color: white; border: none; width: 38px; height: 38px; border-radius: 50%; font-size: 16px; cursor: pointer; display: flex; justify-content: center; align-items: center; }

        /* One-Time Registration Screen */
        .center-screen { flex: 1; width: 100%; background: linear-gradient(180deg, #ffffff 0%, #f4f7f6 100%); display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 24px; text-align: center; gap: 16px; }
        .logo-badge { width: 76px; height: 76px; background: linear-gradient(135deg, #25d366, #008069); border-radius: 22px; display: flex; justify-content: center; align-items: center; font-size: 38px; color: white; }
        .name-input { width: 100%; max-width: 300px; padding: 14px; border: 2px solid #008069; border-radius: 12px; font-size: 16px; outline: none; text-align: center; }
        .gender-group { display: flex; gap: 12px; width: 100%; max-width: 300px; }
        .gender-btn { flex: 1; padding: 13px; border: 2px solid #cfd8dc; background: #fff; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; }
        .gender-btn.selected { border-color: #008069; background: #d9fdd3; color: #008069; }
        .error-text { color: #e53935; font-size: 13px; font-weight: 600; display: none; }
        .action-btn { background: linear-gradient(90deg, #00a884, #008069); color: white; border: none; padding: 15px 32px; border-radius: 28px; font-size: 16px; font-weight: 700; cursor: pointer; }

        /* WhatsApp-Style Home Contact List */
        .home-screen { flex: 1; display: none; flex-direction: column; overflow: hidden; background: #ffffff; }
        .contact-list { flex: 1; overflow-y: auto; }
        .contact-row { display: flex; align-items: center; padding: 14px 16px; border-bottom: 1px solid #f0f2f5; cursor: pointer; gap: 14px; transition: 0.15s; }
        .contact-row:active { background-color: #f0f2f5; }
        .contact-details { flex: 1; overflow: hidden; }
        .contact-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .contact-name { font-size: 16px; font-weight: 600; color: #111b21; }
        .contact-time { font-size: 11px; color: #667781; }
        .contact-sub { font-size: 13px; color: #667781; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .empty-list { padding: 50px 24px; text-align: center; color: #667781; display: flex; flex-direction: column; align-items: center; gap: 14px; }

        /* Chat Screen */
        .chat-screen { flex: 1; width: 100%; display: none; flex-direction: column; overflow: hidden; background: #efeae2; }
        .messages { flex: 1; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 9px; background-image: radial-gradient(#cbd5e1 1px, transparent 1px); background-size: 18px 18px; }
        .message { max-width: 80%; padding: 9px 13px; border-radius: 12px; font-size: 15px; line-height: 1.4; box-shadow: 0 1px 2px rgba(0,0,0,0.12); word-wrap: break-word; }
        .message.sent { background-color: #d9fdd3; align-self: flex-end; border-top-right-radius: 2px; }
        .message.received { background-color: #ffffff; align-self: flex-start; border-top-left-radius: 2px; }
        .chat-media { max-width: 100%; max-height: 250px; border-radius: 8px; margin: 4px 0; display: block; }
        .meta-info { float: right; margin-left: 10px; margin-top: 5px; display: flex; align-items: center; gap: 4px; }
        .timestamp { font-size: 10px; color: #667781; }
        .ticks { font-size: 11px; font-weight: bold; color: #8696a0; }
        .ticks.seen { color: #53bdeb; }

        /* Input Area */
        .input-area { background: #f0f2f5; padding: 10px 12px; display: flex; gap: 8px; align-items: center; border-top: 1px solid #e0e0e0; }
        .attach-btn { background: #fff; border: none; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; font-size: 20px; }
        .input-area input[type="text"] { flex: 1; padding: 12px 16px; border: none; border-radius: 24px; outline: none; font-size: 15px; background: #fff; }
        .send-btn { background: #008069; color: white; border: none; width: 46px; height: 46px; border-radius: 50%; cursor: pointer; font-size: 18px; }

        /* Call Screen */
        .call-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100dvh; background: rgba(11,20,26,0.97); z-index: 50; display: none; flex-direction: column; justify-content: space-between; align-items: center; padding: 30px 20px; color: white; }
        .video-grid { width: 100%; flex: 1; position: relative; margin: 15px 0; border-radius: 16px; overflow: hidden; background: #1f2c34; }
        #remote-video { width: 100%; height: 100%; object-fit: cover; }
        #local-video { width: 110px; height: 150px; object-fit: cover; position: absolute; bottom: 12px; right: 12px; border-radius: 12px; border: 2px solid #25d366; }
        .call-controls { display: flex; gap: 25px; }
        .call-action-btn { width: 62px; height: 62px; border-radius: 50%; border: none; font-size: 24px; color: white; cursor: pointer; }
        .btn-accept { background: #25d366; }
        .btn-reject { background: #e53935; }
    </style>
</head>
<body>
<div class="app-container">

    <!-- SCREEN 1: ONE-TIME NAME & GENDER SETUP -->
    <div class="center-screen" id="register-screen" style="display: none;">
        <div class="logo-badge">⚡</div>
        <h2>Welcome to Zip</h2>
        <p>Sirf ek baar apna naam aur gender daalein, agli baar seedha chat khulegi:</p>
        <input type="text" id="username-input" class="name-input" placeholder="Enter your 5 word name" autocomplete="off" />
        <div class="gender-group">
            <button type="button" class="gender-btn" id="btn-male">👨 Male</button>
            <button type="button" class="gender-btn" id="btn-female">👩 Female</button>
        </div>
        <div class="error-text" id="name-error">5 akshar ka naam aur Male/Female chunna zaroori hai!</div>
        <button type="button" class="action-btn" id="save-profile-btn">Aage Badhein</button>
    </div>

    <!-- SCREEN 2: WHATSAPP STYLE CHAT LIST -->
    <div class="home-screen" id="home-screen">
        <div class="header">
            <div class="header-left">
                <div class="avatar">⚡</div>
                <div class="header-info">
                    <h3>Welcome to Zip</h3>
                    <p id="my-profile-badge">Chats</p>
                </div>
            </div>
            <button type="button" class="invite-btn" id="home-invite-btn">+ Invite Link</button>
        </div>
        <div class="contact-list" id="contact-list"></div>
    </div>

    <!-- SCREEN 3: PERSONAL 1-TO-1 CHAT -->
    <div class="chat-screen" id="chat-screen">
        <div class="header">
            <div class="header-left">
                <button type="button" class="back-btn" id="back-to-home-btn">←</button>
                <div class="avatar" id="chat-avatar">U</div>
                <div class="header-info">
                    <h3 id="chat-friend-name">Friend</h3>
                    <p id="chat-friend-status">Offline</p>
                </div>
            </div>
            <div style="display:flex; gap:8px;">
                <button type="button" class="icon-btn" id="voice-call-btn">📞</button>
                <button type="button" class="icon-btn" id="video-call-btn">📹</button>
            </div>
        </div>
        <div class="messages" id="messages"></div>
        <form class="input-area" id="chat-form">
            <input type="file" id="media-input" accept="image/*,video/*" style="display: none;" />
            <button type="button" class="attach-btn" id="attach-btn">📎</button>
            <input type="text" id="msg-input" placeholder="Message likhein..." autocomplete="off" />
            <button type="submit" class="send-btn">➤</button>
        </form>
    </div>

    <!-- SCREEN 4: VOICE / VIDEO CALL OVERLAY -->
    <div class="call-overlay" id="call-overlay">
        <div style="text-align:center;">
            <h3 id="call-title">Calling...</h3>
            <p id="call-status" style="color:#25d366;">Connecting...</p>
        </div>
        <div class="video-grid">
            <video id="remote-video" autoplay playsinline></video>
            <video id="local-video" autoplay playsinline muted></video>
        </div>
        <div class="call-controls">
            <button type="button" class="call-action-btn btn-accept" id="accept-call-btn" style="display: none;">📞</button>
            <button type="button" class="call-action-btn btn-reject" id="end-call-btn">📵</button>
        </div>
    </div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    const urlParams = new URLSearchParams(window.location.search);
    const inviteFrom = urlParams.get('invite');

    // Phone mein saved user data check karein
    let myUser = JSON.parse(localStorage.getItem('zip_user') || 'null');
    let contacts = [];
    let activeFriendId = null;
    let chatHistory = JSON.parse(localStorage.getItem('zip_chats') || '{}');
    let selectedGender = "";

    // WebRTC Call Variables
    let localStream = null, peerConnection = null, pendingOffer = null, currentCallType = 'video', callTargetId = null;
    const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    // App khulte hi check karein ki user pehle se registered hai ya nahi
    if (myUser && myUser.id && myUser.name) {
        startApp();
    } else {
        document.getElementById('register-screen').style.display = 'flex';
    }

    document.getElementById('btn-male').addEventListener('click', () => {
        selectedGender = 'Male';
        document.getElementById('btn-male').classList.add('selected');
        document.getElementById('btn-female').classList.remove('selected');
    });

    document.getElementById('btn-female').addEventListener('click', () => {
        selectedGender = 'Female';
        document.getElementById('btn-female').classList.add('selected');
        document.getElementById('btn-male').classList.remove('selected');
    });

    document.getElementById('save-profile-btn').addEventListener('click', () => {
        const nameVal = document.getElementById('username-input').value.trim();
        if (nameVal.length < 5 || !selectedGender) {
            document.getElementById('name-error').style.display = 'block';
            return;
        }
        myUser = {
            id: 'u_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6),
            name: nameVal,
            gender: selectedGender
        };
        localStorage.setItem('zip_user', JSON.stringify(myUser));
        document.getElementById('register-screen').style.display = 'none';
        startApp();
    });

    function startApp() {
        document.getElementById('home-screen').style.display = 'flex';
        document.getElementById('my-profile-badge').innerText = `${myUser.name} (${myUser.gender})`;
        socket.emit('register', {
            userId: myUser.id,
            name: myUser.name,
            gender: myUser.gender,
            inviteFrom: inviteFrom
        });
        // URL se ?invite hata dein taaki clean dikhe
        if (inviteFrom) window.history.replaceState({}, '', window.location.pathname);
        renderContactList();
    }

    // Reconnect hone par dubara register karein
    socket.on('connect', () => {
        if (myUser) {
            socket.emit('register', { userId: myUser.id, name: myUser.name, gender: myUser.gender });
        }
    });

    // Invite link copy karna
    document.getElementById('home-invite-btn').addEventListener('click', () => {
        const inviteUrl = window.location.origin + '/?invite=' + myUser.id;
        navigator.clipboard.writeText(inviteUrl).then(() => {
            alert("Aapka Personal Invite Link copy ho gaya hai! Jis dost ko ye link bhejenge, uska naam aapki list mein line se aa jayega.");
        }).catch(() => {
            prompt("Is link ko copy karke dost ko bhejein:", inviteUrl);
        });
    });

    // Server se contacts update milna
    socket.on('contact list', (list) => {
        contacts = list;
        renderContactList();
        if (activeFriendId) {
            const f = contacts.find(c => c.id === activeFriendId);
            if (f) {
                document.getElementById('chat-friend-status').innerText = f.online ? "Online" : "Offline";
                document.getElementById('chat-friend-status').style.color = f.online ? "#d9fdd3" : "#ffcccb";
            }
        }
    });

    // WhatsApp jaisi line se list dikhana
    function renderContactList() {
        const listDiv = document.getElementById('contact-list');
        if (contacts.length === 0) {
            listDiv.innerHTML = `
                <div class="empty-list">
                    <div style="font-size:44px;">💬</div>
                    <h3>Abhi koi dost nahi juda hai</h3>
                    <p>Upar <b>+ Invite Link</b> par click karke link apne doston ko bhejein. Jaise hi woh apna naam dalenge, unki line yahan ban jayegi.</p>
                </div>`;
            return;
        }

        listDiv.innerHTML = '';
        contacts.forEach(friend => {
            const msgs = chatHistory[friend.id] || [];
            const lastMsg = msgs.length > 0 ? msgs[msgs.length - 1] : null;
            const previewText = lastMsg ? (lastMsg.mediaType ? `📎 ${lastMsg.mediaType.toUpperCase()}` : lastMsg.text) : `${friend.gender} • Tap to chat`;
            const timeText = lastMsg ? lastMsg.time : '';

            const row = document.createElement('div');
            row.className = 'contact-row';
            row.innerHTML = `
                <div class="avatar">
                    ${friend.name.charAt(0).toUpperCase()}
                    ${friend.online ? '<span class="online-dot"></span>' : ''}
                </div>
                <div class="contact-details">
                    <div class="contact-top">
                        <span class="contact-name">${friend.name} (${friend.gender})</span>
                        <span class="contact-time">${timeText}</span>
                    </div>
                    <div class="contact-sub">${previewText}</div>
                </div>
            `;
            row.addEventListener('click', () => openChatWith(friend));
            listDiv.appendChild(row);
        });
    }

    // Kisi dost ke naam par click karke chat kholna
    function openChatWith(friend) {
        activeFriendId = friend.id;
        document.getElementById('home-screen').style.display = 'none';
        document.getElementById('chat-screen').style.display = 'flex';
        document.getElementById('chat-avatar').innerText = friend.name.charAt(0).toUpperCase();
        document.getElementById('chat-friend-name').innerText = `${friend.name} (${friend.gender})`;
        document.getElementById('chat-friend-status').innerText = friend.online ? "Online" : "Offline";
        document.getElementById('chat-friend-status').style.color = friend.online ? "#d9fdd3" : "#ffcccb";

        const box = document.getElementById('messages');
        box.innerHTML = '';
        const msgs = chatHistory[friend.id] || [];
        msgs.forEach(m => {
            appendMessageToUI(m);
            if (m.fromUserId === friend.id && !m.seenSent) {
                socket.emit('message seen', { toUserId: friend.id, msgId: m.msgId });
                m.seenSent = true;
            }
        });
        localStorage.setItem('zip_chats', JSON.stringify(chatHistory));
    }

    document.getElementById('back-to-home-btn').addEventListener('click', () => {
        activeFriendId = null;
        document.getElementById('chat-screen').style.display = 'none';
        document.getElementById('home-screen').style.display = 'flex';
        renderContactList();
    });

    // Text message bhejna
    document.getElementById('chat-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const input = document.getElementById('msg-input');
        if (input.value.trim() && activeFriendId) {
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            socket.emit('private message', {
                toUserId: activeFriendId,
                msgId: "m_" + Date.now(),
                text: input.value.trim(),
                time
            });
            input.value = '';
        }
    });

    // Photo / Video bhejna
    document.getElementById('attach-btn').addEventListener('click', () => document.getElementById('media-input').click());
    document.getElementById('media-input').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file || !activeFriendId || file.size > 20 * 1024 * 1024) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            socket.emit('private message', {
                toUserId: activeFriendId,
                msgId: "m_" + Date.now(),
                mediaData: ev.target.result,
                mediaType: file.type.startsWith('video/') ? 'video' : 'image',
                time
            });
        };
        reader.readAsDataURL(file);
        e.target.value = "";
    });

    // Message receive aur save karna
    socket.on('private message', (data) => {
        const friendId = data.fromUserId === myUser.id ? data.toUserId : data.fromUserId;
        if (!chatHistory[friendId]) chatHistory[friendId] = [];
        chatHistory[friendId].push(data);
        localStorage.setItem('zip_chats', JSON.stringify(chatHistory));

        if (activeFriendId === friendId) {
            appendMessageToUI(data);
            if (data.fromUserId !== myUser.id) {
                socket.emit('message seen', { toUserId: friendId, msgId: data.msgId });
            }
        } else {
            renderContactList();
        }
    });

    function appendMessageToUI(data) {
        const isMe = data.fromUserId === myUser.id;
        const div = document.createElement('div');
        d
