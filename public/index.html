<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Welcome to Zip</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100dvh;background:#fff;overflow:hidden}
.app{width:100%;height:100dvh;display:flex;flex-direction:column;position:relative}
.hdr{background:#008069;color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between}
.hdr-l{display:flex;align-items:center;gap:10px}
.av{width:40px;height:40px;background:#dfe5e7;border-radius:50%;display:flex;justify-content:center;align-items:center;color:#008069;font-weight:700;position:relative}
.ai-av{background:#5e35b1;color:#fff}
.dot{width:10px;height:10px;background:#25d366;border:2px solid #fff;border-radius:50%;position:absolute;bottom:0;right:0}
.inv-btn{background:#25d366;color:#fff;border:none;padding:8px 12px;border-radius:20px;font-weight:700;font-size:12px}
.ic-btn{background:rgba(255,255,255,.2);color:#fff;border:none;width:36px;height:36px;border-radius:50%;font-size:16px}
.notif-bar{background:#e1f3fb;color:#075e54;padding:8px 14px;font-size:12.5px;display:none;justify-content:space-between;align-items:center;border-bottom:1px solid #cce7f5}
.notif-bar button{background:#008069;color:#fff;border:none;padding:5px 11px;border-radius:14px;font-size:11.5px;font-weight:700}
.reg{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px;text-align:center;gap:15px}
.badge{width:70px;height:70px;background:#008069;border-radius:20px;display:flex;justify-content:center;align-items:center;font-size:34px;color:#fff}
.inp{width:100%;max-width:290px;padding:13px;border:2px solid #008069;border-radius:10px;font-size:16px;text-align:center}
.g-box{display:flex;gap:12px;width:100%;max-width:290px}
.g-btn{flex:1;padding:14px;border:2px solid #ccc;background:#fff;border-radius:10px;font-size:15px;font-weight:700}
.g-btn.act{border-color:#008069;background:#d9fdd3;color:#008069}
.err{color:#e53935;font-size:13px;font-weight:700;display:none}
.go-btn{background:#008069;color:#fff;border:none;padding:15px 34px;border-radius:25px;font-size:16px;font-weight:700}
.home{flex:1;display:none;flex-direction:column;overflow:hidden}
.list{flex:1;overflow-y:auto}
.row{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid #eee;gap:12px}
.badge-u{background:#25d366;color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:10px}
.chat{flex:1;display:none;flex-direction:column;overflow:hidden;background:#efeae2}
.msgs{flex:1;padding:12px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.msg{max-width:80%;padding:8px 12px;border-radius:10px;font-size:15px;word-wrap:break-word;white-space:pre-line}
.sent{background:#d9fdd3;align-self:flex-end}
.rcvd{background:#fff;align-self:flex-start}
.media{max-width:100%;max-height:220px;border-radius:8px;display:block;margin:4px 0}
.meta{float:right;margin-left:8px;margin-top:4px;font-size:10px;color:#667781}
.seen{color:#53bdeb;font-weight:700}
.bar{background:#f0f2f5;padding:8px 10px;display:flex;gap:8px;align-items:center}
.bar input[type=text]{flex:1;padding:11px 14px;border:none;border-radius:20px;font-size:15px;outline:none}
.c-ov{position:fixed;inset:0;background:rgba(11,20,26,.97);z-index:50;display:none;flex-direction:column;justify-content:space-between;align-items:center;padding:24px 16px;color:#fff}
.v-box{width:100%;flex:1;position:relative;margin:12px 0;background:#1f2c34;border-radius:12px;overflow:hidden;display:flex;justify-content:center;align-items:center}
#r-vid{width:100%;height:100%;object-fit:cover}
#l-vid{width:100px;height:140px;object-fit:cover;position:absolute;bottom:10px;right:10px;border-radius:10px;border:2px solid #25d366;transform:scaleX(-1)}
.hold-b{position:absolute;background:rgba(0,0,0,.8);padding:10px 20px;border-radius:20px;color:#ffd54f;font-weight:700;display:none;z-index:5}
.c-ctrls{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.c-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px}
.c-btn{width:52px;height:52px;border-radius:50%;border:none;font-size:20px;color:#fff;background:#37474f}
.c-btn.on{background:#fff;color:#111}
</style>
</head>
<body>
<div class="app">
  <div class="reg" id="s-reg">
    <div class="badge">⚡</div>
    <h2>Welcome to Zip</h2>
    <p>Sirf ek baar naam aur gender daalein:</p>
    <input type="text" id="u-name" class="inp" placeholder="Enter your 5 word name">
    <div class="g-box">
      <button type="button" class="g-btn" id="b-m" onclick="selG('Male')">👨 Male</button>
      <button type="button" class="g-btn" id="b-f" onclick="selG('Female')">👩 Female</button>
    </div>
    <div class="err" id="err">5 akshar ka naam aur Male/Female chunein!</div>
    <button type="button" class="go-btn" onclick="goApp()">Aage Badhein</button>
  </div>

  <div class="home" id="s-home">
    <div class="hdr">
      <div class="hdr-l"><div class="av">⚡</div><div><h3>Welcome to Zip</h3><p id="my-tag" style="font-size:11px;color:#d9fdd3"></p></div></div>
      <div style="display:flex;gap:6px">
        <button type="button" class="ic-btn" onclick="askNotif()" title="Notifications">🔔</button>
        <button type="button" class="inv-btn" onclick="shareApp()">Share App</button>
      </div>
    </div>
    <div class="notif-bar" id="n-bar">
      <span>🔔 Message & Call alerts on karein</span>
      <button type="button" onclick="askNotif()">Allow</button>
    </div>
    <div class="list" id="c-list"></div>
  </div>

  <div class="chat" id="s-chat">
    <div class="hdr">
      <div class="hdr-l">
        <button type="button" onclick="backHome()" style="background:none;border:none;color:#fff;font-size:22px">←</button>
        <div class="av" id="f-av">U</div>
        <div><h3 id="f-name" style="font-size:15px">Friend</h3><p id="f-st" style="font-size:11px">Offline</p></div>
      </div>
      <div id="c-icons" style="display:flex;gap:8px">
        <button type="button" class="ic-btn" onclick="callNow('audio')">📞</button>
        <button type="button" class="ic-btn" onclick="callNow('video')">📹</button>
      </div>
    </div>
    <div class="msgs" id="msgs"></div>
    <form class="bar" onsubmit="sendTxt(event)">
      <input type="file" id="f-med" accept="image/*,video/*" style="display:none" onchange="sendMed(event)">
      <button type="button" onclick="document.getElementById('f-med').click()" style="background:#fff;border:none;width:40px;height:40px;border-radius:50%;font-size:18px">📎</button>
      <input type="text" id="t-msg" placeholder="Message likhein...">
      <button type="submit" style="background:#008069;color:#fff;border:none;width:42px;height:42px;border-radius:50%;font-size:17px">➤</button>
    </form>
  </div>

  <div class="c-ov" id="s-call">
    <div style="text-align:center"><h3 id="c-tit">Calling...</h3><p id="c-st" style="color:#25d366">Connecting...</p></div>
    <div class="v-box"><div class="hold-b" id="h-ban">⏸️ Call on Hold</div><video id="r-vid" autoplay playsinline></video><video id="l-vid" autoplay playsinline muted></video></div>
    <div class="c-ctrls">
      <div class="c-wrap" id="w-acc" style="display:none"><button type="button" class="c-btn" onclick="accCall()" style="background:#25d366">📞</button><span>Accept</span></div>
      <div class="c-wrap"><button type="button" class="c-btn" id="b-mute" onclick="togMute()">🎤</button><span id="l-mute">Mute</span></div>
      <div class="c-wrap"><button type="button" class="c-btn" id="b-spk" onclick="togSpk()">🔊</button><span id="l-spk">Speaker</span></div>
      <div class="c-wrap"><button type="button" class="c-btn" id="b-hold" onclick="togHold()">⏸️</button><span id="l-hold">Hold</span></div>
      <div class="c-wrap" id="w-flip" style="display:none"><button type="button" class="c-btn" onclick="flipCam()">🔄</button><span>Flip</span></div>
      <div class="c-wrap"><button type="button" class="c-btn" onclick="stopC(true)" style="background:#e53935">📵</button><span>End</span></div>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = typeof io !== 'undefined' ? io() : {emit:()=>{},on:()=>{}};
let me = null; try{ me = JSON.parse(localStorage.getItem('zip_user')); }catch(e){}
let chats = {}; try{ chats = JSON.parse(localStorage.getItem('zip_chats')) || {}; }catch(e){}
let contacts = []; try{ contacts = JSON.parse(localStorage.getItem('zip_contacts')) || []; }catch(e){}
let unread = {}, fid = null, gen = '', lStream = null, pc = null, pOffer = null, cType = 'video', cTarget = null, fMode = 'user';
let mMute = false, sMute = false, onHold = false, ringTimer = null;
const rtc = {iceServers:[{urls:'stun:stun.l.google.com:19302'}]};
const AI = {id:'zip_ai_bot',name:'Zip AI',gender:'AI',online:true};

// Notification Sound & Vibration
function playTone(isCall){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(isCall ? 880 : 660, ctx.currentTime);
    gain.gain.setValueAtTime(0.18, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + (isCall ? 0.5 : 0.25));
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + (isCall ? 0.5 : 0.25));
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate(isCall ? [300,150,300] : [150]);
}

function askNotif(){
  if(!('Notification' in window)) return;
  Notification.requestPermission().then(p => {
    document.getElementById('n-bar').style.display = p === 'granted' ? 'none' : 'flex';
    if(p === 'granted') sendPhoneNotif('Zip Notifications On 🔔', 'Ab aapko naye messages aur calls ke alerts milenge!');
  });
}

function sendPhoneNotif(title, body){
  if('Notification' in window && Notification.permission === 'granted'){
    try{
      const n = new Notification(title, { body: body, tag: 'zip-alert' });
      n.onclick = () => { window.focus(); n.close(); };
    }catch(e){}
  }
}

function selG(g){
  gen = g;
  document.getElementById('b-m').classList.toggle('act', g==='Male');
  document.getElementById('b-f').classList.toggle('act', g==='Female');
}

function goApp(){
  const n = document.getElementById('u-name').value.trim();
  if(n.length < 5 || !gen){ document.getElementById('err').style.display='block'; return; }
  document.getElementById('err').style.display='none';
  me = {id:'u_'+Date.now()+'_'+Math.random().toString(36).slice(2,6), name:n, gender:gen};
  try{ localStorage.setItem('zip_user', JSON.stringify(me)); }catch(e){}
  askNotif();
  boot();
}

function boot(){
  document.getElementById('s-reg').style.display='none';
  document.getElementById('s-home').style.display='flex';
  document.getElementById('my-tag').innerText = me.name+' ('+me.gender+')';
  if('Notification' in window && Notification.permission !== 'granted'){
    document.getElementById('n-bar').style.display = 'flex';
  }
  socket.emit('register',{userId:me.id,name:me.name,gender:me.gender});
  drawList();
}
if(me && me.id && me.name) boot();
socket.on('connect',()=>{ if(me) socket.emit('register',{userId:me.id,name:me.name,gender:me.gender}); });

function shareApp(){
  const u = location.origin;
  if(navigator.clipboard) navigator.clipboard.writeText(u).then(()=>alert('Link copy ho gaya!')).catch(()=>prompt('Copy:',u));
  else prompt('Copy:',u);
}

socket.on('contact list',(l)=>{
  l.forEach(s=>{ const i=contacts.findIndex(c=>c.id===s.id); if(i>=0) contacts[i]=s; else contacts.unshift(s); });
  try{ localStorage.setItem('zip_contacts', JSON.stringify(contacts)); }catch(e){}
  drawList();
  if(fid && fid!==AI.id){ const f=contacts.find(c=>c.id===fid); if(f) document.getElementById('f-st').innerText=f.online?'Online':'Offline'; }
});

function drawList(){
  const box = document.getElementById('c-list'); box.innerHTML='';
  [AI, ...contacts.filter(c=>c.id!==AI.id)].forEach(f=>{
    const isAI = f.id===AI.id, m = chats[f.id]||[], last = m[m.length-1], uc = unread[f.id]||0;
    const r = document.createElement('div'); r.className='row';
    r.innerHTML='<div class="av '+(isAI?'ai-av':'')+'">'+(isAI?'🤖':f.name[0].toUpperCase())+(f.online?'<span class="dot"></span>':'')+'</div><div style="flex:1"><div style="display:flex;justify-content:space-between"><b>'+f.name+(isAI?' ✨':' ('+f.gender+')')+'</b><span style="font-size:11px;color:#667781">'+(last?last.time:'')+'</span></div><div style="display:flex;justify-content:space-between"><span style="font-size:13px;color:#667781">'+(last?(last.mediaType?'📎 Media':last.text):(isAI?'Ask AI anything':'Tap to chat'))+'</span>'+(uc?'<span class="badge-u">'+uc+'</span>':'')+'</div></div>';
    r.onclick = ()=>{
      fid = f.id; unread[f.id]=0;
      document.getElementById('s-home').style.display='none'; document.getElementById('s-chat').style.display='flex';
      document.getElementById('f-av').innerText=isAI?'🤖':f.name[0].toUpperCase();
      document.getElementById('f-av').className='av'+(isAI?' ai-av':'');
      document.getElementById('f-name').innerText=isAI?'Zip AI ✨':f.name+' ('+f.gender+')';
      document.getElementById('f-st').innerText=f.online?'Online':'Offline';
      document.getElementById('c-icons').style.display=isAI?'none':'flex';
      const mb=document.getElementById('msgs'); mb.innerHTML='';
      if(isAI && !m.length) addMsg({fromUserId:AI.id,text:'Namaste '+me.name+'! Main Zip AI hoon 🤖 Kuch bhi poochein!',time:'Now'});
      m.forEach(x=>{ addMsg(x); if(x.fromUserId===f.id && !x.seenSent && !isAI){ socket.emit('message seen',{toUserId:f.id,msgId:x.msgId}); x.seenSent=true; } });
      try{ localStorage.setItem('zip_chats',JSON.stringify(chats)); }catch(e){}
    };
    box.appendChild(r);
  });
}

function backHome(){ fid=null; document.getElementById('s-chat').style.display='none'; document.getElementById('s-home').style.display='flex'; drawList(); }

function sendTxt(e){
  e.preventDefault();
  const i=document.getElementById('t-msg');
  if(i.value.trim() && fid){
    socket.emit('private message',{toUserId:fid,msgId:'m_'+Date.now(),text:i.value.trim(),time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})});
    i.value='';
  }
}

function sendMed(e){
  const file=e.target.files[0]; if(!file||!fid||file.size>20*1024*1024) return;
  const rd=new FileReader();
  rd.onload=(ev)=>{ socket.emit('private message',{toUserId:fid,msgId:'m_'+Date.now(),mediaData:ev.target.result,mediaType:file.type.startsWith('video/')?'video':'image',time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}); };
  rd.readAsDataURL(file); e.target.value='';
}

socket.on('private message',(d)=>{
  const id = d.fromUserId===me.id ? d.toUserId : d.fromUserId;
  if(!chats[id]) chats[id]=[];
  if(!chats[id].some(x=>x.msgId===d.msgId)){ chats[id].push(d); try{localStorage.setItem('zip_chats',JSON.stringify(chats));}catch(e){} }
  if(id!==AI.id){
    const idx=contacts.findIndex(c=>c.id===id);
    if(idx===-1 && d.fromUserId!==me.id){ contacts.unshift({id:d.fromUserId,name:d.senderName||'User',gender:d.senderGender||'',online:true}); try{localStorage.setItem('zip_contacts',JSON.stringify(contacts));}catch(e){} }
  }

  // Incoming message alert & phone notification
  if(d.fromUserId !== me.id){
    playTone(false);
    if(document.hidden || fid !== id){
      sendPhoneNotif((d.senderName || 'Zip Message') + ' • Zip', d.mediaType ? '📎 Sent a ' + d.mediaType : d.text);
    }
  }

  if(fid===id){ addMsg(d); if(d.fromUserId!==me.id && id!==AI.id) socket.emit('message seen',{toUserId:id,msgId:d.msgId}); }
  else{ if(d.fromUserId!==me.id) unread[id]=(unread[id]||0)+1; drawList(); }
});

function addMsg(d){
  const isMe=d.fromUserId===me.id, div=document.createElement('div');
  div.className='msg '+(isMe?'sent':'rcvd');
  const med=d.mediaData?(d.mediaType==='video'?'<video src="'+d.mediaData+'" controls class="media"></video>':'<img src="'+d.mediaData+'" class="media">'):'';
  div.innerHTML=med+(d.text?'<span>'+d.text+'</span>':'')+'<span class="meta">'+d.time+(isMe?' <span class="'+(d.seen?'seen':'')+'" id="tk-'+d.msgId+'">'+(d.seen?'✓✓':'✓')+'</span>':'')+'</span>';
  const mb=document.getElementById('msgs'); mb.appendChild(div); mb.scrollTop=mb.scrollHeight;
}

socket.on('message seen',({fromUserId,msgId})=>{
  if(chats[fromUserId]){ const m=chats[fromUserId].find(x=>x.msgId===msgId); if(m) m.seen=true; try{localStorage.setItem('zip_chats',JSON.stringify(chats));}catch(e){} }
  const t=document.getElementById('tk-'+msgId); if(t){ t.innerText='✓✓'; t.classList.add('seen'); }
});

async function setupP(tp){
  cType=tp; mMute=false; sMute=false; onHold=false;
  document.getElementById('b-mute').classList.remove('on'); document.getElementById('b-spk').classList.remove('on'); document.getElementById('b-hold').classList.remove('on');
  document.getElementById('h-ban').style.display='none'; document.getElementById('r-vid').muted=false;
  if(lStream) lStream.getTracks().forEach(t=>t.stop());
  lStream=await navigator.mediaDevices.getUserMedia({audio:true,video:tp==='video'?{facingMode:fMode}:false});
  const lv=document.getElementById('l-vid'); lv.srcObject=lStream; lv.style.display=tp==='video'?'block':'none';
  document.getElementById('w-flip').style.display=tp==='video'?'flex':'none';
  pc=new RTCPeerConnection(rtc); lStream.getTracks().forEach(t=>pc.addTrack(t,lStream));
  pc.ontrack=(e)=>{ document.getElementById('r-vid').srcObject=e.streams[0]; };
  pc.onicecandidate=(e)=>{ if(e.candidate && cTarget) socket.emit('ice-candidate',{toUserId:cTarget,candidate:e.candidate}); };
}

function togMute(){ if(!lStream)return; mMute=!mMute; lStream.getAudioTracks().forEach(t=>t.enabled=!mMute&&!onHold); document.getElementById('b-mute').classList.toggle('on',mMute); }
function togSpk(){ sMute=!sMute; document.getElementById('r-vid').muted=sMute||onHold; document.getElementById('b-spk').classList.toggle('on',sMute); }
function togHold(){
  if(!lStream)return; onHold=!onHold;
  lStream.getAudioTracks().forEach(t=>t.enabled=!onHold&&!mMute);
  lStream.getVideoTracks().forEach(t=>t.enabled=!onHold);
  document.getElementById('r-vid').muted=onHold||sMute;
  document.getElementById('b-hold').classList.toggle('on',onHold);
  document.getElementById('h-ban').style.display=onHold?'block':'none';
  if(cTarget) socket.emit('call-hold',{toUserId:cTarget,isHold:onHold});
}
socket.on('call-hold',({isHold})=>{ document.getElementById('h-ban').style.display=isHold?'block':'none'; });

async function flipCam(){
  if(cType!=='video'||!pc)return; fMode=fMode==='user'?'environment':'user';
  try{
    const ns=await navigator.mediaDevices.getUserMedia({audio:true,video:{facingMode:fMode}});
    const vt=ns.getVideoTracks()[0], snd=pc.getSenders().find(s=>s.track&&s.track.kind==='video');
    if(snd) await snd.replaceTrack(vt);
    if(lStream) lStream.getVideoTracks().forEach(t=>t.stop());
    lStream=ns; document.getElementById('l-vid').srcObject=lStream;
  }catch(e){}
}

async function callNow(tp){
  if(!fid||fid===AI.id)return;
  try{
    cTarget=fid; document.getElementById('s-call').style.display='flex';
    document.getElementById('c-tit').innerText=tp==='video'?'Video Calling...':'Voice Calling...';
    document.getElementById('c-st').innerText='Ringing...'; document.getElementById('w-acc').style.display='none';
    await setupP(tp); const off=await pc.createOffer(); await pc.setLocalDescription(off);
    socket.emit('call-user',{toUserId:cTarget,offer:off,callType:tp});
  }catch(e){ alert('Camera/Mic allow karein!'); stopC(false); }
}

socket.on('incoming-call',({fromUserId,callerName,offer,callType})=>{
  cTarget=fromUserId; pOffer=offer; cType=callType;
  document.getElementById('s-call').style.display='flex'; document.get
