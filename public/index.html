<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Welcome to Zip</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100dvh;background:#fff;overflow:hidden}
.app{width:100%;height:100dvh;display:flex;flex-direction:column;position:relative}
.hdr{background:#008069;color:#fff;padding:13px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.hdr-l{display:flex;align-items:center;gap:9px;overflow:hidden}
.av{width:40px;height:40px;background:#dfe5e7;border-radius:50%;display:flex;justify-content:center;align-items:center;color:#008069;font-weight:700;position:relative;flex-shrink:0}
.ai-av{background:#5e35b1;color:#fff}
.grp-av{background:#0288d1;color:#fff}
.dot{width:10px;height:10px;background:#25d366;border:2px solid #fff;border-radius:50%;position:absolute;bottom:0;right:0}
.btn-s{background:#25d366;color:#fff;border:none;padding:8px 12px;border-radius:18px;font-weight:700;font-size:12px;cursor:pointer}
.ic{background:rgba(255,255,255,.2);color:#fff;border:none;width:36px;height:36px;border-radius:50%;font-size:15px;cursor:pointer}
.reg{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px;text-align:center;gap:15px;overflow-y:auto}
.inp{width:100%;max-width:290px;padding:14px;border:2px solid #008069;border-radius:10px;font-size:16px;text-align:center;background:#fff}
.g-box{display:flex;gap:12px;width:100%;max-width:290px}
.g-btn{flex:1;padding:15px;border:2px solid #ccc;background:#fff;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer}
.act{border-color:#008069;background:#d9fdd3;color:#008069}
.go{width:100%;max-width:290px;background:#008069;color:#fff;border:none;padding:16px;border-radius:25px;font-size:16px;font-weight:700;cursor:pointer}
.go:active{background:#005c4b}
.home,.chat{flex:1;display:none;flex-direction:column;overflow:hidden}
.chat{background:#efeae2}
.list,.msgs{flex:1;overflow-y:auto}
.msgs{padding:12px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;padding:13px 15px;border-bottom:1px solid #eee;gap:12px;cursor:pointer}
.bdg{background:#25d366;color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:10px}
.msg{max-width:82%;padding:8px 11px;border-radius:10px;font-size:15px;word-wrap:break-word;white-space:pre-line}
.sent{background:#d9fdd3;align-self:flex-end}
.rcvd{background:#fff;align-self:flex-start}
.g-sender{font-size:11px;font-weight:700;color:#008069;display:block;margin-bottom:2px}
.med{max-width:100%;max-height:220px;border-radius:8px;display:block;margin:4px 0}
.meta{display:flex;justify-content:flex-end;align-items:center;gap:6px;margin-top:4px;font-size:10px;color:#667781}
.m-act{background:none;border:none;font-size:13px;cursor:pointer;padding:2px 4px}
.seen{color:#53bdeb;font-weight:700}
.bar{background:#f0f2f5;padding:8px 10px;display:flex;gap:8px;align-items:center}
.bar input[type=text]{flex:1;padding:11px 14px;border:none;border-radius:20px;font-size:15px;outline:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:none;justify-content:center;align-items:center;padding:16px}
.m-box{background:#fff;width:100%;max-width:360px;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;max-height:80vh}
.m-list{overflow-y:auto;max-height:220px;border:1px solid #eee;border-radius:8px}
.m-item{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid #f5f5f5;cursor:pointer}
.c-ov{position:fixed;inset:0;background:#0b141a;z-index:50;display:none;flex-direction:column;justify-content:space-between;align-items:center;padding:24px 16px;color:#fff}
.v-box{width:100%;flex:1;position:relative;margin:12px 0;background:#1f2c34;border-radius:12px;overflow:hidden;display:flex;justify-content:center;align-items:center}
#rv{width:100%;height:100%;object-fit:cover}
#lv{width:100px;height:140px;object-fit:cover;position:absolute;bottom:10px;right:10px;border-radius:10px;border:2px solid #25d366;transform:scaleX(-1)}
.hb{position:absolute;background:rgba(0,0,0,.8);padding:10px 20px;border-radius:20px;color:#ffd54f;font-weight:700;display:none}
.cc{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.cw{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px}
.cb{width:52px;height:52px;border-radius:50%;border:none;font-size:20px;color:#fff;background:#37474f}
.cb.on{background:#fff;color:#111}
</style>
</head>
<body>
<div class="app">
  <div class="reg" id="sr">
    <div style="font-size:44px">⚡</div>
    <h2>Welcome to Zip</h2>
    <input type="text" id="un" class="inp" placeholder="Enter your 5 word name">
    <div class="g-box">
      <button type="button" class="g-btn" id="bm" onclick="setG('Male')">👨 Male</button>
      <button type="button" class="g-btn" id="bf" onclick="setG('Female')">👩 Female</button>
    </div>
    <div id="er" style="color:red;font-size:13px;font-weight:700;display:none"></div>
    <button type="button" class="go" onclick="enterApp()">Aage Badhein</button>
  </div>

  <div class="home" id="sh">
    <div class="hdr">
      <div class="hdr-l"><div class="av">⚡</div><div><h3>Welcome to Zip</h3><p id="mt" style="font-size:11px;color:#d9fdd3"></p></div></div>
      <div style="display:flex;gap:6px">
        <button type="button" class="btn-s" onclick="openGrp()">+ Group</button>
        <button type="button" class="ic" onclick="reqNotif()">🔔</button>
        <button type="button" class="btn-s" onclick="shareUrl()">Share</button>
      </div>
    </div>
    <div class="list" id="cl"></div>
  </div>

  <div class="chat" id="sc">
    <div class="hdr">
      <div class="hdr-l">
        <button type="button" onclick="goHome()" style="background:none;border:none;color:#fff;font-size:22px">←</button>
        <div class="av" id="fa">U</div>
        <div style="overflow:hidden"><h3 id="fn" style="font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Friend</h3><p id="fs" style="font-size:11px">Offline</p></div>
      </div>
      <div style="display:flex;gap:6px;flex-shrink:0">
        <button type="button" class="ic" onclick="clearMsgs()">🗑️</button>
        <button type="button" class="ic" id="bac" onclick="makeCall('audio')">📞</button>
        <button type="button" class="ic" id="bvc" onclick="makeCall('video')">📹</button>
      </div>
    </div>
    <div class="msgs" id="ms"></div>
    <form class="bar" onsubmit="sendText(event)">
      <input type="file" id="fm" accept="image/*,video/*" style="display:none" onchange="sendFile(event)">
      <button type="button" onclick="document.getElementById('fm').click()" style="background:#fff;border:none;width:40px;height:40px;border-radius:50%;font-size:18px">📎</button>
      <input type="text" id="tm" placeholder="Message likhein...">
      <button type="submit" style="background:#008069;color:#fff;border:none;width:42px;height:42px;border-radius:50%;font-size:17px">➤</button>
    </form>
  </div>

  <div class="modal" id="g-mod">
    <div class="m-box">
      <h3>Naya Group Banayein 👥</h3>
      <input type="text" id="g-name" class="inp" style="max-width:100%" placeholder="Group ka naam likhein...">
      <div class="m-list" id="g-members"></div>
      <div style="display:flex;gap:10px;justify-content:flex-end">
        <button type="button" onclick="closeGrp()" style="padding:10px 16px;border:none;border-radius:20px;background:#eee">Cancel</button>
        <button type="button" onclick="saveGrp()" style="padding:10px 18px;border:none;border-radius:20px;background:#008069;color:#fff;font-weight:700">Create Group</button>
      </div>
    </div>
  </div>

  <div class="c-ov" id="so">
    <div style="text-align:center"><h3 id="ct">Calling...</h3><p id="cs" style="color:#25d366">Connecting...</p></div>
    <div class="v-box"><div class="hb" id="hb">⏸️ On Hold</div><video id="rv" autoplay playsinline></video><video id="lv" autoplay playsinline muted></video></div>
    <div class="cc">
      <div class="cw" id="wa" style="display:none"><button type="button" class="cb" onclick="acceptCall()" style="background:#25d366">📞</button><span>Accept</span></div>
      <div class="cw"><button type="button" class="cb" id="bmu" onclick="toggleMute()">🎤</button><span>Mute</span></div>
      <div class="cw"><button type="button" class="cb" id="bsp" onclick="toggleSpk()">🔊</button><span>Speaker</span></div>
      <div class="cw"><button type="button" class="cb" id="bho" onclick="toggleHold()">⏸️</button><span>Hold</span></div>
      <div class="cw" id="wf" style="display:none"><button type="button" class="cb" onclick="flipCamera()">🔄</button><span>Flip</span></div>
      <div class="cw"><button type="button" class="cb" onclick="endCall(true)" style="background:#e53935">📵</button><span>End</span></div>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
var sk = { emit: function(){}, on: function(){} };
try { if (typeof io !== 'undefined') sk = io(); } catch(e) {}

var me = null, ch = {}, ct = [], grps = [];
try {
  me = JSON.parse(localStorage.getItem('zip_user'));
  ch = JSON.parse(localStorage.getItem('zip_chats')) || {};
  ct = JSON.parse(localStorage.getItem('zip_contacts')) || [];
  grps = JSON.parse(localStorage.getItem('zip_groups')) || [];
} catch(e) {}

var ur = {}, fid = null, isGrpChat = false, gen = '';
var ls = null, pc = null, po = null, ctp = 'video', ctg = null, fmd = 'user';
var mm = false, smu = false, oh = false, rt = null;
var rtc = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
var AI = { id: 'zip_ai_bot', name: 'Zip AI', gender: 'AI', online: true };

function setG(g) {
  gen = g;
  document.getElementById('bm').className = g === 'Male' ? 'g-btn act' : 'g-btn';
  document.getElementById('bf').className = g === 'Female' ? 'g-btn act' : 'g-btn';
  document.getElementById('er').style.display = 'none';
}

function enterApp() {
  var inp = document.getElementById('un');
  var er = document.getElementById('er');
  var n = inp.value.trim();
  if (n.length < 5) {
    er.innerText = 'Naam kam se kam 5 akshar ka likhein!';
    er.style.display = 'block';
    return;
  }
  if (!gen) {
    er.innerText = 'Male ya Female par click karke chunein!';
    er.style.display = 'block';
    return;
  }
  er.style.display = 'none';
  me = { id: 'u_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6), name: n, gender: gen };
  try { localStorage.setItem('zip_user', JSON.stringify(me)); } catch(e) {}
  reqNotif();
  openHome();
}

function openHome() {
  document.getElementById('sr').style.display = 'none';
  document.getElementById('sh').style.display = 'flex';
  document.getElementById('mt').innerText = me.name + ' (' + me.gender + ')';
  sk.emit('register', { userId: me.id, name: me.name, gender: me.gender });
  renderList();
}

if (me && me.id && me.name) { openHome(); }

sk.on('connect', function() {
  if (me) sk.emit('register', { userId: me.id, name: me.name, gender: me.gender });
});

function reqNotif() {
  try { if ('Notification' in window) Notification.requestPermission(); } catch(e) {}
}
function sendNotif(t, b) {
  try { if ('Notification' in window && Notification.permission === 'granted') new Notification(t, { body: b }); } catch(e) {}
}
function tone(c) {
  try {
    var x = new (window.AudioContext || window.webkitAudioContext)();
    var o = x.createOscillator(), g = x.createGain();
    o.frequency.value = c ? 880 : 660; g.gain.value = 0.15;
    o.connect(g); g.connect(x.destination); o.start(); o.stop(x.currentTime + 0.3);
  } catch(e) {}
  if (navigator.vibrate) navigator.vibrate(c ? [300, 150, 300] : 150);
}
function shareUrl() {
  var u = location.origin;
  if (navigator.clipboard) navigator.clipboard.writeText(u).then(function() { alert('Link copied!'); });
  else prompt('Copy link:', u);
}

sk.on('contact list', function(l) {
  l.forEach(function(s) {
    var i = ct.findIndex(function(c) { return c.id === s.id; });
    if (i >= 0) ct[i] = s; else ct.unshift(s);
  });
  try { localStorage.setItem('zip_contacts', JSON.stringify(ct)); } catch(e) {}
  renderList();
  if (fid && !isGrpChat && fid !== AI.id) {
    var f = ct.find(function(c) { return c.id === fid; });
    if (f) document.getElementById('fs').innerText = f.online ? 'Online' : 'Offline';
  }
});

sk.on('group list', function(gl) {
  grps = gl;
  try { localStorage.setItem('zip_groups', JSON.stringify(grps)); } catch(e) {}
  renderList();
});

var selMembers = new Set();
function openGrp() {
  selMembers.clear();
  document.getElementById('g-name').value = '';
  var box = document.getElementById('g-members'); box.innerHTML = '';
  if (!ct.length) box.innerHTML = '<p style="padding:12px;font-size:13px;color:#667781">Abhi koi dost list mein nahi hai.</p>';
  ct.forEach(function(f) {
    var item = document.createElement('div'); item.className = 'm-item';
    item.innerHTML = '<span>' + f.name + ' (' + f.gender + ')</span><input type="checkbox" style="width:18px;height:18px">';
    item.onclick = function() {
      var cb = item.querySelector('input'); cb.checked = !cb.checked;
      if (cb.checked) selMembers.add(f.id); else selMembers.delete(f.id);
    };
    box.appendChild(item);
  });
  document.getElementById('g-mod').style.display = 'flex';
}
function closeGrp() { document.getElementById('g-mod').style.display = 'none'; }
function saveGrp() {
  var gn = document.getElementById('g-name').value.trim();
  if (!gn || selMembers.size === 0) { alert('Group naam aur kam se kam 1 dost chunein!'); return; }
  sk.emit('create group', { groupName: gn, memberIds: Array.from(selMembers) });
  closeGrp();
}

function renderList() {
  var b = document.getElementById('cl'); b.innerHTML = '';
  var all = [AI].concat(grps.map(function(g) { return Object.assign({}, g, { isGrp: true }); })).concat(ct.filter(function(c) { return c.id !== AI.id; }));
  all.forEach(function(f) {
    var ai = f.id === AI.id, grp = !!f.isGrp, m = ch[f.id] || [], la = m[m.length - 1], uc = ur[f.id] || 0;
    var r = document.createElement('div'); r.className = 'row';
    var avC = ai ? 'ai-av' : (grp ? 'grp-av' : '');
    var avT = ai ? '🤖' : (grp ? '👥' : f.name[0].toUpperCase());
    var sub = la ? (la.mediaType ? '📎 Media' : la.text) : (ai ? 'Ask AI' : (grp ? f.members.length + ' Members' : 'Tap to chat'));
    r.innerHTML = '<div class="av ' + avC + '">' + avT + (!grp && f.online ? '<span class="dot"></span>' : '') + '</div>' +
      '<div style="flex:1;overflow:hidden"><div style="display:flex;justify-content:space-between"><b>' + f.name + (ai ? ' ✨' : (grp ? ' (Group)' : ' (' + f.gender + ')')) + '</b><span style="font-size:11px;color:#667781">' + (la ? la.time : '') + '</span></div>' +
      '<div style="display:flex;justify-content:space-between"><span style="font-size:13px;color:#667781;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + sub + '</span>' + (uc ? '<span class="bdg">' + uc + '</span>' : '') + '</div></div>';
    r.onclick = function() {
      fid = f.id; isGrpChat = grp; ur[f.id] = 0;
      document.getElementById('sh').style.display = 'none'; document.getElementById('sc').style.display = 'flex';
      document.getElementById('fa').innerText = avT; document.getElementById('fa').className = 'av ' + avC;
      document.getElementById('fn').innerText = ai ? 'Zip AI ✨' : (grp ? f.name : f.name + ' (' + f.gender + ')');
      document.getElementById('fs').innerText = grp ? (f.members.length + ' Members') : (f.online ? 'Online' : 'Offline');
      document.getElementById('bac').style.display = (ai || grp) ? 'none' : 'inline-block';
      document.getElementById('bvc').style.display = (ai || grp) ? 'none' : 'inline-block';
      var mb = document.getElementById('ms'); mb.innerHTML = '';
      if (ai && !m.length) appendMsg({ fromUserId: AI.id, text: 'Namaste ' + me.name + '! Main Zip AI hoon 🤖', time: 'Now' });
      m.forEach(function(x) {
        appendMsg(x);
        if (!grp && x.fromUserId === f.id && !x.ss && !ai) { sk.emit('message seen', { toUserId: f.id, msgId: x.msgId }); x.ss = true; }
      });
      try { localStorage.setItem('zip_chats', JSON.stringify(ch)); } catch(e) {}
    };
    b.appendChild(r);
  });
}

function goHome() { fid = null; isGrpChat = false; document.getElementById('sc').style.display = 'none'; document.getElementById('sh').style.display = 'flex'; renderList(); }
function clearMsgs() { if (fid && confirm('Saare messages delete karein?')) { ch[fid] = []; try { localStorage.setItem('zip_chats', JSON.stringify(ch)); } catch(e) {} document.getElementById('ms').innerHTML = ''; } }

function sendText(e) {
  e.preventDefault();
  var i = document.getElementById('tm');
  if (i.value.trim() && fid) {
    sk.emit('private message', { toUserId: fid, msgId: 'm_' + Date.now(), text: i.value.trim(), time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }), isGroup: isGrpChat });
    i.value = '';
  }
}

function sendFile(e) {
  var f = e.target.files[0];
  if (!f || !fid || f.size > 20 * 1024 * 1024) return;
  var r = new FileReader();
  r.onload = function(v) {
    sk.emit('private message', { toUserId: fid, msgId: 'm_' + Date.now(), mediaData: v.target.result, mediaType: f.type.startsWith('video/') ? 'video' : 'image', time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }), isGroup: isGrpChat });
  };
  r.readAsDataURL(f); e.target.value = '';
}

sk.on('private message', function(d) {
  var id = d.isGroup ? d.toUserId : (d.fromUserId === me.id ? d.toUserId : d.fromUserId);
  if (!ch[id]) ch[id] = [];
  if (!ch[id].some(function(x) { return x.msgId === d.msgId; })) { ch[id].push(d); try { localStorage.setItem('zip_chats', JSON.stringify(ch)); } catch(e) {} }
  if (!d.isGroup && id !== AI.id && ct.findIndex(function(c) { return c.id === id; }) === -1 && d.fromUserId !== me.id) {
    ct.unshift({ id: d.fromUserId, name: d.senderName || 'User', gender: d.senderGender || '', online: true });
    try { localStorage.setItem('zip_contacts', JSON.stringify(ct)); } catch(e) {}
  }
  if (d.fromUserId !== me.id) { tone(false); if (document.hidden || fid !== id) sendNotif((d.senderName || 'Zip') + ' • Zip', d.mediaType ? '📎 Media' : d.text); }
  if (fid === id) { appendMsg(d); if (!d.isGroup && d.fromUserId !== me.id && id !== AI.id) sk.emit('message seen', { toUserId: id, msgId: d.msgId }); }
  else { if (d.fromUserId !== me.id) ur[id] = (ur[id] || 0) + 1; renderList(); }
});

function appendMsg(d) {
  var m = d.fromUserId === me.id, v = document.createElement('div');
  v.className = 'msg ' + (m ? 'sent' : 'rcvd'); v.id = 'msg-box-' + d.msgId;
  var gs = (d.isGroup && !m) ? '<span class="g-sender">' + d.senderName + '</span>' : '';
  var md = d.mediaData ? (d.mediaType === 'video' ? '<video src="' + d.mediaData + '" controls class="med"></video>' : '<img src="' + d.mediaData + '" class="med">') : '';
  var th = d.text ? '<span id="txt-' + d.msgId + '">' + d.text + (d.edited ? ' <i style="font-size:10px;color:#667781">(edited)</i>' : '') + '</span>' : '';
  var eb = (m && d.text && fid !== AI.id) ? '<button type="button" class="m-act" onclick="editMsg(\'' + d.msgId + '\')">✏️</button>' : '';
  var db = (m && fid !== AI.id) ? '<button type="button" class="m-act" onclick="delMsg(\'' + d.msgId + '\')">🗑️</button>' : '';
  v.innerHTML = gs + md + th + '<div class="meta">' + eb + db + '<span>' + d.time + '</span>' + (m && !d.isGroup ? ' <span class="' + (d.seen ? 'seen' : '') + '" id="tk-' + d.msgId + '">' + (d.seen ? '✓✓' : '✓') + '</span>' : '') + '</div>';
  var b = document.getElementById('ms'); b.appendChild(v); b.scrollTop = b.scrollHeight;
}

function editMsg(id) {
  if (!fid) return;
  var o = (ch[fid] || []).find(function(x) { return x.msgId === id; });
  if (!o) r
