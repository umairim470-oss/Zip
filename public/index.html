<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Welcome to Zip</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            width: 100%;
            height: 100dvh;
            background: #ffffff;
            overflow: hidden;
        }
        .app {
            width: 100%;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .hdr {
            background: #008069;
            color: #ffffff;
            padding: 13px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .hdr-l {
            display: flex;
            align-items: center;
            gap: 9px;
            overflow: hidden;
        }
        .av {
            width: 40px;
            height: 40px;
            background: #dfe5e7;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #008069;
            font-weight: 700;
            position: relative;
            flex-shrink: 0;
        }
        .ai-av { background: #5e35b1; color: #ffffff; }
        .grp-av { background: #0288d1; color: #ffffff; }
        .dot {
            width: 10px;
            height: 10px;
            background: #25d366;
            border: 2px solid #ffffff;
            border-radius: 50%;
            position: absolute;
            bottom: 0;
            right: 0;
        }
        .btn-s {
            background: #25d366;
            color: #ffffff;
            border: none;
            padding: 8px 12px;
            border-radius: 18px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
        }
        .ic {
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 15px;
            cursor: pointer;
        }
        .reg {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            text-align: center;
            gap: 15px;
            overflow-y: auto;
        }
        .inp {
            width: 100%;
            max-width: 290px;
            padding: 14px;
            border: 2px solid #008069;
            border-radius: 10px;
            font-size: 16px;
            text-align: center;
            background: #ffffff;
        }
        .g-box {
            display: flex;
            gap: 12px;
            width: 100%;
            max-width: 290px;
        }
        .g-btn {
            flex: 1;
            padding: 15px;
            border: 2px solid #cccccc;
            background: #ffffff;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }
        .act {
            border-color: #008069;
            background: #d9fdd3;
            color: #008069;
        }
        .go {
            width: 100%;
            max-width: 290px;
            background: #008069;
            color: #ffffff;
            border: none;
            padding: 16px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }
        .go:active { background: #005c4b; }
        .home, .chat {
            flex: 1;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }
        .chat { background: #efeae2; }
        .list, .msgs { flex: 1; overflow-y: auto; }
        .msgs {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .row {
            display: flex;
            align-items: center;
            padding: 13px 15px;
            border-bottom: 1px solid #eeeeee;
            gap: 12px;
            cursor: pointer;
        }
        .bdg {
            background: #25d366;
            color: #ffffff;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 10px;
        }
        .msg {
            max-width: 82%;
            padding: 8px 11px;
            border-radius: 10px;
            font-size: 15px;
            word-wrap: break-word;
            white-space: pre-line;
        }
        .sent { background: #d9fdd3; align-self: flex-end; }
        .rcvd { background: #ffffff; align-self: flex-start; }
        .g-sender {
            font-size: 11px;
            font-weight: 700;
            color: #008069;
            display: block;
            margin-bottom: 2px;
        }
        .med {
            max-width: 100%;
            max-height: 220px;
            border-radius: 8px;
            display: block;
            margin: 4px 0;
        }
        .meta {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 6px;
            margin-top: 4px;
            font-size: 10px;
            color: #667781;
        }
        .m-act {
            background: none;
            border: none;
            font-size: 13px;
            cursor: pointer;
            padding: 2px 4px;
        }
        .seen { color: #53bdeb; font-weight: 700; }
        .bar {
            background: #f0f2f5;
            padding: 8px 10px;
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .bar input[type=text] {
            flex: 1;
            padding: 11px 14px;
            border: none;
            border-radius: 20px;
            font-size: 15px;
            outline: none;
        }
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 40;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .m-box {
            background: #ffffff;
            width: 100%;
            max-width: 360px;
            border-radius: 16px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 80vh;
        }
        .m-list {
            overflow-y: auto;
            max-height: 220px;
            border: 1px solid #eeeeee;
            border-radius: 8px;
        }
        .m-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            border-bottom: 1px solid #f5f5f5;
            cursor: pointer;
        }
        .c-ov {
            position: fixed;
            inset: 0;
            background: #0b141a;
            z-index: 50;
            display: none;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 24px 16px;
            color: #ffffff;
        }
        .v-box {
            width: 100%;
            flex: 1;
            position: relative;
            margin: 12px 0;
            background: #1f2c34;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #rv { width: 100%; height: 100%; object-fit: cover; }
        #lv {
            width: 100px;
            height: 140px;
            object-fit: cover;
            position: absolute;
            bottom: 10px;
            right: 10px;
            border-radius: 10px;
            border: 2px solid #25d366;
            transform: scaleX(-1);
        }
        .hb {
            position: absolute;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 20px;
            border-radius: 20px;
            color: #ffd54f;
            font-weight: 700;
            display: none;
        }
        .cc {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }
        .cw {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 11px;
        }
        .cb {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: none;
            font-size: 20px;
            color: #ffffff;
            background: #37474f;
        }
        .cb.on { background: #ffffff; color: #111111; }
    </style>
</head>
<body>
<div class="app">
    <div class="reg" id="sr">
        <div style="font-size: 44px;">⚡</div>
        <h2>Welcome to Zip</h2>
        <input type="text" id="un" class="inp" placeholder="Enter your 5 word name">
        <div class="g-box">
            <button type="button" class="g-btn" id="bm">👨 Male</button>
            <button type="button" class="g-btn" id="bf">👩 Female</button>
        </div>
        <div id="er" style="color: red; font-size: 13px; font-weight: 700; display: none;">5 akshar ka naam aur Gender chunein!</div>
        <button type="button" class="go" id="bgo">Aage Badhein</button>
    </div>

    <div class="home" id="sh">
        <div class="hdr">
            <div class="hdr-l">
                <div class="av">⚡</div>
                <div>
                    <h3>Welcome to Zip</h3>
                    <p id="mt" style="font-size: 11px; color: #d9fdd3;"></p>
                </div>
            </div>
            <div style="display: flex; gap: 6px;">
                <button type="button" class="btn-s" id="bgrp">+ Group</button>
                <button type="button" class="ic" id="bnot">🔔</button>
                <button type="button" class="btn-s" id="bshr">Share</button>
            </div>
        </div>
        <div class="list" id="cl"></div>
    </div>

    <div class="chat" id="sc">
        <div class="hdr">
            <div class="hdr-l">
                <button type="button" id="bbk" style="background: none; border: none; color: #ffffff; font-size: 22px;">←</button>
                <div class="av" id="fa">U</div>
                <div style="overflow: hidden;">
                    <h3 id="fn" style="font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Friend</h3>
                    <p id="fs" style="font-size: 11px;">Offline</p>
                </div>
            </div>
            <div style="display: flex; gap: 6px; flex-shrink: 0;">
                <button type="button" class="ic" id="bclr">🗑️</button>
                <button type="button" class="ic" id="bac">📞</button>
                <button type="button" class="ic" id="bvc">📹</button>
            </div>
        </div>
        <div class="msgs" id="ms"></div>
        <form class="bar" id="fmsg">
            <input type="file" id="fm" accept="image/*,video/*" style="display: none;">
            <button type="button" id="batt" style="background: #ffffff; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 18px;">📎</button>
            <input type="text" id="tm" placeholder="Message likhein...">
            <button type="submit" style="background: #008069; color: #ffffff; border: none; width: 42px; height: 42px; border-radius: 50%; font-size: 17px;">➤</button>
        </form>
    </div>

    <div class="modal" id="g-mod">
        <div class="m-box">
            <h3>Naya Group Banayein 👥</h3>
            <input type="text" id="g-name" class="inp" style="max-width: 100%;" placeholder="Group ka naam likhein...">
            <div class="m-list" id="g-members"></div>
            <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <button type="button" id="gcan" style="padding: 10px 16px; border: none; border-radius: 20px; background: #eeeeee;">Cancel</button>
                <button type="button" id="gcre" style="padding: 10px 18px; border: none; border-radius: 20px; background: #008069; color: #ffffff; font-weight: 700;">Create Group</button>
            </div>
        </div>
    </div>

    <div class="c-ov" id="so">
        <div style="text-align: center;">
            <h3 id="ct">Calling...</h3>
            <p id="cs" style="color: #25d366;">Connecting...</p>
        </div>
        <div class="v-box">
            <div class="hb" id="hb">⏸️ On Hold</div>
            <video id="rv" autoplay playsinline></video>
            <video id="lv" autoplay playsinline muted></video>
        </div>
        <div class="cc">
            <div class="cw" id="wa" style="display: none;"><button type="button" class="cb" id="bacc" style="background: #25d366;">📞</button><span>Accept</span></div>
            <div class="cw"><button type="button" class="cb" id="bmu">🎤</button><span>Mute</span></div>
            <div class="cw"><button type="button" class="cb" id="bsp">🔊</button><span>Speaker</span></div>
            <div class="cw"><button type="button" class="cb" id="bho">⏸️</button><span>Hold</span></div>
            <div class="cw" id="wf" style="display: none;"><button type="button" class="cb" id="bfl">🔄</button><span>Flip</span></div>
            <div class="cw"><button type="button" class="cb" id="ben" style="background: #e53935;">📵</button><span>End</span></div>
        </div>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
window.addEventListener('DOMContentLoaded', function() {
    var sk = (typeof io !== 'undefined') ? io() : { emit: function(){}, on: function(){} };
    var me = null;
    try { me = JSON.parse(localStorage.getItem('zip_user')); } catch(e) {}
    var ch = {};
    try { ch = JSON.parse(localStorage.getItem('zip_chats')) || {}; } catch(e) {}
    var ct = [];
    try { ct = JSON.parse(localStorage.getItem('zip_contacts')) || []; } catch(e) {}
    var grps = [];
    try { grps = JSON.parse(localStorage.getItem('zip_groups')) || []; } catch(e) {}

    var ur = {};
    var fid = null;
    var isGrpChat = false;
    var gen = '';
    var ls = null;
    var pc = null;
    var po = null;
    var ctp = 'video';
    var ctg = null;
    var fmd = 'user';
    var mm = false;
    var smu = false;
    var oh = false;
    var rt = null;

    var rtc = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
    var AI = { id: 'zip_ai_bot', name: 'Zip AI', gender: 'AI', online: true };

    function tone(c) {
        try {
            var x = new (window.AudioContext || window.webkitAudioContext)();
            var o = x.createOscillator();
            var g = x.createGain();
            o.frequency.value = c ? 880 : 660;
            g.gain.value = 0.15;
            o.connect(g);
            g.connect(x.destination);
            o.start();
            o.stop(x.currentTime + 0.3);
        } catch(e) {}
        if (navigator.vibrate) navigator.vibrate(c ? [300, 150, 300] : 150);
    }

    function an() {
        try { if ('Notification' in window) Notification.requestPermission(); } catch(e) {}
    }

    function pn(t, b) {
        try {
            if ('Notification' in window && Notification.permission === 'granted') {
                new Notification(t, { body: b });
            }
        } catch(e) {}
    }

    document.getElementById('bm').addEventListener('click', function() {
        gen = 'Male';
        document.getElementById('bm').classList.add('act');
        document.getElementById('bf').classList.remove('act');
        document.getElementById('er').style.display = 'none';
    });

    document.getElementById('bf').addEventListener('click', function() {
        gen = 'Female';
        document.getElementById('bf').classList.add('act');
        document.getElementById('bm').classList.remove('act');
        document.getElementById('er').style.display = 'none';
    });

    document.getElementById('bgo').addEventListener('click', function() {
        var inp = document.getElementById('un');
        inp.blur();
        var n = inp.value.trim();
        var err = document.getElementById('er');
        if (n.length < 5) {
            err.innerText = 'Naam kam se kam 5 akshar ka likhein!';
            err.style.display = 'block';
            return;
        }
        if (!gen) {
            err.innerText = 'Male ya Female par touch karke chunein!';
            err.style.display = 'block';
            return;
        }
        err.style.display = 'none';
        me = { id: 'u_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6), name: n, gender: gen };
        try { localStorage.setItem('zip_user', JSON.stringify(me)); } catch(e) {}
        an();
        bt();
    });

    function bt() {
        document.getElementById('sr').style.display = 'none';
        document.getElementById('sh').style.display = 'flex';
        document.getElementById('mt').innerText = me.name + ' (' + me.gender + ')';
        sk.emit('register', { userId: me.id, name: me.name, gender: me.gender });
        dl();
    }

    if (me && me.id && me.name) bt();

    sk.on('connect', function() {
        if (me) sk.emit('register', { userId: me.id, name: me.name, gender: me.gender });
    });

    document.getElementById('bnot').addEventListener('click', an);
    document.getElementById('bshr').addEventListener('click', function() {
        var u = location.origin;
        if (navigator.clipboard) navigator.clipboard.writeText(u).then(function() { alert('Link copied!'); });
        else prompt('Copy:', u);
    });

    sk.on('contact list', function(l) {
        l.forEach(function(s) {
            var i = ct.findIndex(function(c) { return c.id === s.id; });
            if (i >= 0) ct[i] = s;
            else ct.unshift(s);
        });
        try { localStorage.setItem('zip_contacts', JSON.stringify(ct)); } catch(e) {}
        dl();
        if (fid && !isGrpChat && fid !== AI.id) {
            var f = ct.find(function(c) { return c.id === fid; });
            if (f) document.getElementById('fs').innerText = f.online ? 'Online' : 'Offline';
        }
    });

    sk.on('group list', function(gl) {
        grps = gl;
        try { localStorage.setItem('zip_groups', JSON.stringify(grps)); } catch(e) {}
        dl();
    });

    var selectedMembers = new Set();
    document.getElementById('bgrp').addEventListener('click', function() {
        selectedMembers.clear();
        document.getElementById('g-name').value = '';
        var box = document.getElementById('g-members');
        box.innerHTML = '';
        if (!ct.length) box.innerHTML = '<p style="padding:12px;font-size:13px;color:#667781">Abhi koi dost list mein nahi hai.</p>';
        ct.forEach(function(f) {
            var item = document.createElement('div');
            item.className = 'm-item';
            item.innerHTML = '<span>' + f.name + ' (' + f.gender + ')</span><input type="checkbox" style="width:18px;height:18px">';
            item.addEventListener('click', function() {
                var cb = item.querySelector('input');
                cb.checked = !cb.checked;
                if (cb.checked) selectedMembers.add(f.id);
                else selectedMembers.delete(f.id);
            });
            box.appendChild(item);
        });
        document.getElementById('g-mod').style.display = 'flex';
    });

    document.getElementById('gcan').addEventListener('click', function() {
        document.getElementById('g-mod').style.display = 'none';
    });

    document.getElementById('gcre').addEventListener('click', function() {
        var gn = document.getElementById('g-name').value.trim();
        if (!gn || selectedMembers.size === 0) {
